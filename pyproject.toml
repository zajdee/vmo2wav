# Configuration for the development tools only; vmo2wav.py is a standalone
# script and is not packaged.

[tool.black]
line-length = 79
target-version = ["py37"]

[tool.ruff]
line-length = 79
target-version = "py37"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PL",      # pylint
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names describe the test; docstrings would only repeat them.
"tests/*" = ["D102"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.mypy]
strict = true
